month = "08"

# ── OCR / 提取可调参数（不写则用括号内默认值） ──
# 扫描件/图片型 PDF 通过本地 mineru-open-api CLI（MinerU Open API 云端）OCR，
# 需已安装并配置 token：`uv tool install mineru-open-api` + `mineru-open-api auth`
ocr_pdf_timeout = 600        # 单个 PDF 整体 OCR 超时（秒），超时则该文件标“无法解析”
pdf_extract_timeout = 120    # PDF 文本提取（pdf-extract）超时（秒）
sparse_threshold = 50        # PDF 非空白字符总数低于此值视为扫描件/图片型

# ── 检索展示 ──
snippet_len = 180            # 命中上下文片段总字符窗口（前 1/3、后 2/3）

# ── 网络 ──
tz_offset = 28800            # 本地时区相对 UTC 偏移秒数（东八区 = +8h）
http_timeout = 120           # HTTP 客户端请求超时（秒）
max_retries = 3              # HTTP 下载重试次数
retry_backoff_base = 800     # 重试退避基准毫秒（第 n 次退避 = base << n）

search = ["天地壹号","天晨","巴马世界"]
